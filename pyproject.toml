[project]
name = "scpi-tracker"
version = "0.1.0"
description = "Collecte, historise et restitue les paramètres clés de SCPI à partir de sources primaires."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "httpx>=0.27",
    "types-requests",
    "types-PyYAML",
    "types-python-dateutil",
]
# Push Google Sheets optionnel (derrière un flag de config, voir README)
sheets = ["gspread>=6.0", "google-auth>=2.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scpi*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI utilise Depends()/Form() comme valeurs par défaut d'arguments (idiome).
"scpi/web/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# pdfplumber / bs4 n'exposent pas toujours des stubs complets
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "bs4.*", "openpyxl.*", "gspread.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
