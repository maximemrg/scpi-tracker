# =============================================================================
# registry.yaml — Registre des SOURCES PRIMAIRES (ÉTAPE 0)
# =============================================================================
# Statut : BROUILLON v0 — À VALIDER avant tout développement.
#
# Convention de confiance des URLs de ce registre :
#   verifie: true   -> URL réellement ouverte et confirmée pendant la recherche
#   verifie: false  -> URL inférée d'un pattern / de résultats de recherche,
#                      NON encore ouverte -> à confirmer par un premier fetch.
#
# Rappel contrainte : les URLs listées ici doivent toutes pointer vers des
# SOURCES PRIMAIRES (site de la société de gestion, bulletins, docs
# réglementaires). Les agrégateurs commerciaux sont listés uniquement en
# "sources_interdites" pour être bloqués côté code.
# =============================================================================

meta:
  version: 0
  date_recherche: "2026-09-14"
  politique_collecte:
    user_agent: "SCPI-Tracker/0.1 (+maximemeurgey@gmail.com)"
    delai_min_secondes: 2
    respect_robots_txt: true
    max_requetes_par_domaine_par_run: 30
  # Domaines JAMAIS utilisés comme source de données (CGU / fraîcheur).
  # Serviront de blocklist dans le code.
  sources_interdites:
    - meilleurescpi.com
    - primaliance.com
    - francescpi.com
    - france-scpi.com
    - louveinvest.com
    - ramify.fr
    - portail-scpi.fr
    - centraledesscpi.com
    - scpi-lab.com
    - scpi-invest.fr
    - haussmann-patrimoine.fr
    - ideal-investisseur.fr
    - weelim.fr
    - aeterniapatrimoine.fr
    - epargnoo.com
    - invest-aide.fr
    - argent-et-salaire.com
    - zoominvest.fr
    - francetransactions.com
    - boursorama.com          # relais de presse, pas source primaire
    - pierrepapier.fr         # relais de presse, pas source primaire

# =============================================================================
# Sociétés de gestion (un adaptateur = une entrée ici)
# =============================================================================
societes_gestion:

  # ---------------------------------------------------------------------------
  corum_lepargne:
    nom: "Corum L'Épargne"
    domaine: "corum.fr"
    verifie: true
    # Fiche produit : corum.fr/nos-scpi/{slug}
    # Documents     : corum.fr/nos-scpi/{slug}/documents  (VÉRIFIÉ sur Eurion)
    # Les bulletins s'appellent "Fil d'Actualités" (T1..T4). Noms de fichiers
    # non prédictibles (/sites/default/files/AAAA-MM/...) -> SCRAPER la page
    # /documents, ne pas deviner l'URL du PDF.
    strategie_bulletin: scrape_listing
    # NOTE PILOTE (T2-2026) : les « Fil d'Actualités » d'Origin et XL sont des
    # plaquettes 100 % image (aucune couche texte) -> non parsables sans OCR
    # (non tenté par choix). Le « Rapport périodique » N'EST PAS un fallback :
    # c'est un document ESG/SFDR sans chiffres financiers (vérifié sur Origin).
    # Piste restante pour ces 2 SCPI : le rapport annuel (1x/an) ou saisie
    # manuelle. Eurion et USA sont en texte exploitable.
    scpi:
      corum_origin:
        nom: "Corum Origin"
        fiche_url: "https://www.corum.fr/nos-scpi/corum-origin"
        documents_url: "https://www.corum.fr/nos-scpi/corum-origin/documents"
        verifie: true
        note: "Bulletin T2-2026 = PDF image (A_VERIFIER). Piste : parser le « Rapport périodique »."
      corum_xl:
        nom: "Corum XL"
        fiche_url: "https://www.corum.fr/nos-scpi/corum-xl"
        documents_url: "https://www.corum.fr/nos-scpi/corum-xl/documents"
        verifie: true
        note: "Bulletin T2-2026 = PDF image (A_VERIFIER). Piste : parser le « Rapport périodique »."
      corum_eurion:
        nom: "Corum Eurion"
        fiche_url: "https://www.corum.fr/nos-scpi/eurion"
        documents_url: "https://www.corum.fr/nos-scpi/eurion/documents"
        verifie: true
      corum_usa:
        nom: "Corum USA"
        fiche_url: "https://www.corum.fr/nos-scpi/corum-usa"
        documents_url: "https://www.corum.fr/nos-scpi/corum-usa/documents"
        verifie: true

  # ---------------------------------------------------------------------------
  inter_gestion_reim:
    nom: "Inter Gestion REIM"
    domaine: "inter-gestion.com"
    verifie: true
    # SOURCE = fiches HTML. Bloc « chiffres clés » = VALEUR puis libellé.
    # Extraction sûre limitée (prix, capi, TRI 10 ans, TD) ; reste -> saisie.
    strategie_bulletin: html_site
    scpi:
      cristal_rente:
        nom: "Cristal Rente"
        fiche_url: "https://www.inter-gestion.com/offre-scpi/cristal-rente"
        documents_url: "https://www.inter-gestion.com/offre-scpi/cristal-rente"
        verifie: true
      cristal_life:
        nom: "Cristal Life"
        fiche_url: "https://www.inter-gestion.com/offre-scpi/cristal-life"
        documents_url: "https://www.inter-gestion.com/offre-scpi/cristal-life"
        verifie: true

  # ---------------------------------------------------------------------------
  swisslife_am_france:
    nom: "Swiss Life Asset Managers France"
    domaine: "fr.swisslife-am.com"
    verifie: false
    # PDF à pattern PRÉDICTIBLE (rare, appréciable) :
    #  .../scpi-pierre-capitale/bulletin-trimestriel/AAAA/Bulletin_Trimestriel_SCPI_ESG_Pierre_Capitale_T{n}_AAAA.pdf
    # BLOCAGE (2026-09-14) : le site renvoie HTTP 403 à un client non-navigateur
    # (requests), alors que robots.txt n'interdit rien. Options : récupération
    # via navigateur réel, ou saisie manuelle. À trancher.
    strategie_bulletin: url_pattern_puis_verif
    scpi:
      esg_pierre_capitale:
        nom: "ESG Pierre Capitale"
        fiche_url: "https://fr.swisslife-am.com/fr/particuliers/documentation/scpi-pierre-capitale.html"
        bulletin_pattern: "https://fr.swisslife-am.com/content/dam/slamfr/internet/particuliers/documentation---retail/scpi-pierre-capitale/bulletin-trimestriel/{annee}/Bulletin_Trimestriel_SCPI_ESG_Pierre_Capitale_T{trimestre}_{annee}.pdf"
        exemple_verifie: "https://fr.swisslife-am.com/content/dam/slamfr/internet/particuliers/documentation---retail/scpi-pierre-capitale/bulletin-trimestriel/2025/Bulletin_Trimestriel_SCPI_ESG_Pierre_Capitale_T4_2025.pdf"
        verifie: false

  # ---------------------------------------------------------------------------
  perial_am:
    nom: "Perial Asset Management"
    domaine: "perial.com"
    verifie: true
    # SOURCE = fiches HTML (Webflow), MAIS grille dont l'aplatissement apparie
    # mal la plupart des tuiles -> seul le TD 2025 est fiable. Reste -> saisie.
    # Rebranding Perial : slugs perial-o2 / perial-grand-paris /
    # perial-hospitalite-europe. 2 SCPI en plus hors périmètre :
    # perial-opportunites-europe, perial-opportunites-territoires.
    strategie_bulletin: html_site
    scpi:
      pfo:
        nom: "PFO"
        fiche_url: "https://www.perial.com/scpi/pfo"
        documents_url: "https://www.perial.com/scpi/pfo"
        verifie: true
      pfo2:
        nom: "PFO2"
        fiche_url: "https://www.perial.com/scpi/perial-o2"   # marque "PERIAL O2"
        documents_url: "https://www.perial.com/scpi/perial-o2"
        verifie: true
      pf_grand_paris:
        nom: "PF Grand Paris"
        fiche_url: "https://www.perial.com/scpi/perial-grand-paris"
        documents_url: "https://www.perial.com/scpi/perial-grand-paris"
        verifie: true
      pf_hospitalite_europe:
        nom: "PF Hospitalité Europe"
        fiche_url: "https://www.perial.com/scpi/perial-hospitalite-europe"
        documents_url: "https://www.perial.com/scpi/perial-hospitalite-europe"
        verifie: true

  # ---------------------------------------------------------------------------
  fiducial_gerance:
    nom: "Fiducial Gérance"
    domaine: "fiducial-gerance.fr"
    verifie: true
    # SOURCE = fiche HTML, MAIS grille dont l'aplatissement mélange
    # libellé/valeur -> extraction limitée aux valeurs explicitement délimitées
    # (retrait, TOF, délai). Le reste -> saisie (ou parsing DOM positionnel).
    strategie_bulletin: html_site
    scpi:
      selectipierre_2:
        nom: "Selectipierre 2"
        nom_officiel: "Sélectipierre 2 Paris"
        fiche_url: "https://www.fiducial-gerance.fr/investir-en-scpi/nos-scpi/selectipierre-2-paris"
        documents_url: "https://www.fiducial-gerance.fr/investir-en-scpi/nos-scpi/selectipierre-2-paris"
        verifie: true

  # ---------------------------------------------------------------------------
  norma_capital:
    nom: "Norma Capital"
    domaine: "normacapital.fr"    # ATTENTION : sans tiret
    verifie: true
    # SOURCE = SITE HTML (pas le PDF) : le portail /documentation/ est en JS et
