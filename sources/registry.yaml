    scpi:
      activimmo:
        nom: "ActivImmo"
        fiche_url: "https://alderan.fr/scpi-activimmo/"
        documents_url: "https://alderan.fr/scpi-activimmo-documentation/"
        verifie: true
        note: "Dividendes versés MENSUELLEMENT depuis 2025 -> acompte en saisie mensuelle."
      comete:
        nom: "Comète"
        fiche_url: "https://alderan.fr/scpi-comete/"
        documents_url: "https://alderan.fr/scpi-comete-documentation/"
        verifie: true
        note: "Dividendes versés MENSUELLEMENT depuis 2025 -> acompte en saisie mensuelle."

  # ---------------------------------------------------------------------------
  sogenial_immobilier:
    nom: "Sogenial Immobilier"
    domaine: "sogenial.fr"
    verifie: true
    # SOURCE = fiches HTML (KPI structurés : TD 2025, TRI 5 ans, valeur de
