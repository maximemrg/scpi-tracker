        fiche_url: "https://www.normacapital.fr/nos-offres-grand-public/scpi-ncap-continent/"
        documents_url: "https://www.normacapital.fr/nos-offres-grand-public/scpi-ncap-continent/"
        verifie: true
      fair_invest:
        nom: "Fair Invest"
        alias: ["NCap Education Santé"]  # renommage CONFIRMÉ (nom actuel)
        fiche_url: "https://www.normacapital.fr/nos-offres-grand-public/scpi-ncap-education-sante/"
