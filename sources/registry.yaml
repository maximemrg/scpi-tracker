  # ---------------------------------------------------------------------------
  kyaneos_am:
    nom: "Kyaneos Asset Management"
    domaine: "kyaneosam.com"
    verifie: true
    # SOURCE = fiche HTML (prix, capitalisation, associés, délai de jouissance).
    strategie_bulletin: html_site
    scpi:
      kyaneos_pierre:
        nom: "Kyaneos Pierre"
        fiche_url: "https://kyaneosam.com/kyaneos-pierre/"
        documents_url: "https://kyaneosam.com/kyaneos-pierre/"  # docs listés sur la fiche
        verifie: true
      kyaneos_denormandie_5:
        nom: "Kyaneos Denormandie 5"
        fiche_url: null   # /kyaneos-denormandie-5/ = HTTP 404 (série visible jusqu'à 4)
        documents_url: null
        verifie: false
        # ALERTE : SCPI fiscale (Denormandie), PAS une SCPI de rendement, ET URL
        # non trouvée -> A_VERIFIER complet, saisie manuelle. À confirmer :
        # existe-t-elle sous un autre nom/slug ?

  # ---------------------------------------------------------------------------
  arkea_reim:
    nom: "Arkéa Real Estate Investment Management"
    domaine: "arkea-reim.com"
    verifie: false
    strategie_bulletin: scrape_listing
    scpi:
      transitions_europe:
        nom: "Transitions Europe"
        note: 'Le brief l''appelle "Arkéa Transitions Europe" ; nom réel = "Transitions Europe".'
        fiche_url: "https://www.arkea-reim.com/immobilier/pa_89367/scpi-transitions-europe"
        documents_url: null
        verifie: false
      momentime:
        nom: "MomenTime"
        note: 'SdG = Arkéa REIM (résout le "À IDENTIFIER" du brief). Lancée fin 2024 / janv. 2025 (date exacte à confirmer).'
        fiche_url: null   # pages news trouvées, page produit à localiser
        documents_url: null
        verifie: false

  # ---------------------------------------------------------------------------
  sofidy:
    nom: "Sofidy"
    domaine: "sofidy.com"
    verifie: false
    # PDF sous /app/uploads/AAAA/MM/{scpi}-bulletin-trimestriel-{n}t{aa}.pdf
    # mais AAAA/MM = date de mise en ligne (imprévisible) -> SCRAPER
    # la page /documentation (filtrable par fonds).
    strategie_bulletin: scrape_listing
    # Bulletins bien listés (anchor "Bulletin Trimestriel - Tn AAAA"), historique
    # profond (jusqu'à 2018 pour Immorente -> utile pour l'onglet Historique).
    # MAIS, comme Corum : chiffres clés en encarts entremêlés + certains nombres
    # en POLICE VECTORISÉE non extractible (glyphes (cid:..)) -> extracteur
    # positionnel Sofidy nécessaire + détection cid -> A_VERIFIER.
    scpi:
      immorente:
        nom: "Immorente"
        fiche_url: "https://www.sofidy.com/documentation/"
        documents_url: "https://www.sofidy.com/documentation/"
        verifie: true   # page listing Immorente confirmée (server-rendered)
      sofidy_europe_invest:
        nom: "Sofidy Europe Invest"
        fiche_url: "https://www.sofidy.com/documentation/sofidy-europe-invest"
