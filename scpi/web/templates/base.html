<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SCPI Tracker{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#f7f7f8; --fg:#1f2430; --line:#e2e3e8; --head:#1F3864; --muted:#8a8f9a; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
           color:var(--fg); background:var(--bg); }
    header { background:var(--head); color:#fff; padding:12px 20px; display:flex; gap:20px; align-items:baseline; }
    header a { color:#dbe3f4; text-decoration:none; }
    header a:hover, header a.active { color:#fff; text-decoration:underline; }
    header .brand { font-weight:700; font-size:16px; color:#fff; }
    main { padding:20px; max-width:1400px; margin:0 auto; }
    table { border-collapse:collapse; width:100%; background:#fff; }
    th, td { border:1px solid var(--line); padding:6px 9px; text-align:right; white-space:nowrap; }
    th { background:var(--head); color:#fff; position:sticky; top:0; font-weight:600; }
    td.l, th.l { text-align:left; }
    tr:nth-child(even) td { background:#fafafc; }
    a { color:#1F3864; }
    .badge { font-size:11px; padding:1px 6px; border-radius:9px; color:#333; }
    .HAUTE { background:#cdebd6; } .MOYENNE { background:#fff0c2; }
    .FAIBLE { background:#ffd9a0; } .MANUELLE { background:#d6e6fb; }
    .averif { color:#9c5700; font-style:italic; background:#f2f2f2; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:18px; }
    .muted { color:var(--muted); }
    input, select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:5px; }
    button { font:inherit; padding:5px 12px; border:0; border-radius:5px; background:var(--head); color:#fff; cursor:pointer; }
    form.inline { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
    h1 { font-size:20px; } h2 { font-size:16px; margin-top:0; }
    .kpi { font-size:13px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">📊 SCPI Tracker</span>
    <a href="/">Tableau de bord</a>
    <a href="/comparatif">Screener</a>
    <a href="/a-verifier">À vérifier</a>
    <a href="/sources">Sources</a>
    <span class="muted" style="margin-left:auto; color:#b9c3da">local · lecture + saisie manuelle</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
  window.SCPI = {
    // Soumission AJAX d'un formulaire d'override ; onOk(data) au succès.
    ajax(form, onOk) {
      const fd = new FormData(form); fd.set('ajax', '1');
      fetch('/override', { method:'POST', body:fd })
        .then(r => r.json())
        .then(d => { if (d.ok && onOk) onOk(d); })
        .catch(() => alert('Échec de l’enregistrement.'));
      return false;
    },
    // Échelle de couleur vert→rouge sur les cellules .num d'un tableau,
    // par colonne (data-col) et sens (data-dir = haut|bas).
    applyScales(table) {
      const cells = [...table.querySelectorAll('td.num[data-val]')];
      const byCol = {};
      cells.forEach(c => { (byCol[c.dataset.col] ??= []).push(c); });
      for (const col in byCol) {
        const cs = byCol[col];
        const vals = cs.map(c => parseFloat(c.dataset.val)).filter(v => !isNaN(v));
        if (!vals.length) continue;
        const min = Math.min(...vals), max = Math.max(...vals);
        cs.forEach(c => {
          const v = parseFloat(c.dataset.val); if (isNaN(v)) return;
          let t = max === min ? 0.5 : (v - min) / (max - min);
          if (c.dataset.dir === 'bas') t = 1 - t;      // faible = mieux
          if (c.dataset.dir === 'none' || !c.dataset.dir) return;
          const r = t < .5 ? 248 : Math.round(248 - (t-.5)*2*(248-99));
          const g = t < .5 ? Math.round(105 + t*2*(190-105)) : 190;
          const b = t < .5 ? 107 : Math.round(190 - (t-.5)*2*(190-123));
          c.style.background = `rgb(${r},${g},${b})`;
        });
      }
    },
    // Tri au clic sur les entêtes .sortable.
    makeSortable(table) {
      table.querySelectorAll('th.sortable').forEach((th, idx) => {
        th.style.cursor = 'pointer'; th.title = 'Trier';
        let asc = true;
        th.addEventListener('click', () => {
          const tb = table.tBodies[0];
          const rows = [...tb.rows];
          const col = th.cellIndex;
          rows.sort((a, b) => {
            const av = a.cells[col].dataset.val, bv = b.cells[col].dataset.val;
            const na = parseFloat(av), nb = parseFloat(bv);
            const bothNum = !isNaN(na) && !isNaN(nb);
            if (bothNum) return asc ? na - nb : nb - na;
            return asc ? (av||'').localeCompare(bv||'') : (bv||'').localeCompare(av||'');
          });
          asc = !asc;
          rows.forEach(r => tb.appendChild(r));
        });
      });
    }
  };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
