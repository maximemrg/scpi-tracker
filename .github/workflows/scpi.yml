name: Collecte SCPI hebdomadaire

on:
  schedule:
    - cron: "0 7 * * 1"        # tous les lundis à 07:00 UTC
  workflow_dispatch: {}         # déclenchement manuel

permissions:
  contents: write               # committer la base + le classeur + la page
  pages: write                  # publier sur GitHub Pages
  id-token: write               # authentification du déploiement Pages

concurrency:
  group: scpi-collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historique complet -> pull --rebase fiable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Contrôles qualité (lint + types + tests)
        run: |
          ruff check scpi tests
          mypy scpi
          pytest -q

      - name: Collecte (toutes les SCPI)
        run: python -m scpi.cli --db data/scpi.sqlite collect --all

      - name: Régénérer le classeur Excel
        run: python -m scpi.cli --db data/scpi.sqlite excel --out SCPI_tracker.xlsx

      - name: Régénérer la page HTML (GitHub Pages)
        run: python -m scpi.cli --db data/scpi.sqlite export-html --out docs/index.html

      - name: Résumé Markdown
        run: python -m scpi.cli --db data/scpi.sqlite summary >> "$GITHUB_STEP_SUMMARY"

      - name: Push Google Sheets (si configuré)
        if: ${{ vars.ENABLE_GSHEETS == 'true' }}
        env:
          SCPI_GSHEET_ID: ${{ vars.SCPI_GSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          pip install -e ".[sheets]"
          python -m scpi.cli --db data/scpi.sqlite push-sheets
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Committer la base, le classeur et la page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scpi.sqlite SCPI_tracker.xlsx docs/index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git commit -m "Collecte SCPI automatique $(date -u +%Y-%m-%d)"
          # Intègre d'éventuels changements distants (course avec un push manuel)
          # puis pousse, avec quelques réessais.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main \
              && git push origin main && { echo "push OK"; exit 0; }
            echo "conflit/refus, réessai $i…"; sleep 5
          done
          echo "Échec du push après réessais" >&2; exit 1

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # Publie la page sur GitHub Pages (URL fixe, toujours à jour).
  pages:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
